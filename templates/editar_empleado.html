{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="mb-4">Editar Empleado</h3>
            <form action="{{ url_for('editar_empleado', id=empleado.id) }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre *</label>
                        <input type="text" name="nombre" class="form-control" value="{{ empleado.nombre }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido *</label>
                        <input type="text" name="apellido" class="form-control" value="{{ empleado.apellido }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" value="{{ empleado.email }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">RUT Ficticio *</label>
                        <input type="text" name="rut" class="form-control" value="{{ empleado.rut }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Cargo *</label>
                        <input type="text" name="cargo" class="form-control" value="{{ empleado.cargo }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Departamento *</label>
                        <input type="text" name="departamento" class="form-control" value="{{ empleado.departamento }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de Ingreso *</label>
                        <input type="date" name="fecha_ingreso" class="form-control" value="{{ empleado.fecha_ingreso }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Estado *</label>
                        <select name="estado" class="form-select" required>
                            <option value="activo" {% if empleado.estado == 'activo' %}selected{% endif %}>Activo</option>
                            <option value="inactivo" {% if empleado.estado == 'inactivo' %}selected{% endif %}>Inactivo</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ empleado.telefono or '' }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Observaciones</label>
                        <textarea name="observaciones" class="form-control" rows="3">{{ empleado.observaciones or '' }}</textarea>
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <a href="{{ url_for('empleados') }}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Actualizar Empleado</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
